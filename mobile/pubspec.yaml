name: medtrackai
description: "MedTrack AI - AI-powered medication management platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # Network & API
  dio: ^5.4.0
  http: ^1.2.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Camera & Image
  image_picker: ^1.0.7
  camera: ^0.10.5+9
  
  # Biometrics
  local_auth: ^3.0.1
  
  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  
  # UI Components
  flutter_animate: ^4.3.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.2.2
  equatable: ^2.0.5
  
  # GoRouter for navigation
  go_router: ^14.6.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/